<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %} Osteoporosis Risk Prediction {% endblock %}</title>

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/logo.png') }}"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },

            colors: {
              whitebg: "#FFFFFF",
            },

            borderRadius: {
              xl: "1rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
            },

            boxShadow: {
              soft: "0 10px 30px rgba(37,99,235,.12)",
            },

            backgroundImage: {
              primary:
                "linear-gradient(135deg,#38BDF8 0%,#2563EB 55%,#1E3A8A 100%)",
              hero: "linear-gradient(135deg,#FFFFFF 0%,#EFF6FF 40%,#DBEAFE 100%)",
            },
          },
        },
      };
    </script>

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body
    class="font-sans bg-gradient-to-br from-white via-blue-50 to-sky-100 text-darkblue antialiased"
  >
    <!-- ================= PRELOADER ================= -->

    <div
      id="loader"
      class="fixed inset-0 z-[9999] flex items-center justify-center bg-white"
    >
      <div
        class="h-16 w-16 rounded-full border-4 border-blue-200 border-t-blue-700 animate-spin"
        role="status"
      >
        <span class="sr-only">Loading...</span>
      </div>
    </div>

    <!-- ================= NAVBAR ================= -->

    {% include 'navbar.html' %}

    <!-- ================= MAIN CONTENT ================= -->

    <main>{% block content %} {% endblock %}</main>

    <!-- ================= FOOTER ================= -->

    {% include 'footer.html' %}

    <!-- ================= BACK TO TOP ================= -->

    <button
      id="backToTop"
      class="fixed bottom-6 right-6 z-50 hidden h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-r from-sky-500 to-blue-700 text-white shadow-soft transition-all duration-300 hover:from-blue-700 hover:to-sky-500 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2"
    >
      <i class="bi bi-arrow-up text-xl"></i>
    </button>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Swiper -->

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- AOS -->

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
      AOS.init({
        duration: 900,
        once: true,
      });
    </script>

    <!-- Back To Top -->

    <script>
      const backToTopBtn = document.getElementById("backToTop");

      if (backToTopBtn) {
        window.addEventListener("scroll", () => {
          if (window.scrollY > 300) {
            backToTopBtn.classList.remove("hidden");
            backToTopBtn.classList.add("flex");
          } else {
            backToTopBtn.classList.add("hidden");
            backToTopBtn.classList.remove("flex");
          }
        });

        backToTopBtn.addEventListener("click", () => {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        });
      }

      const loader = document.getElementById("loader");

      if (loader) {
        window.addEventListener("load", () => {
          loader.classList.add(
            "opacity-0",
            "pointer-events-none",
            "transition-opacity",
            "duration-500",
          );

          setTimeout(() => loader.remove(), 500);
        });
      }
    </script>

    <!-- Custom JS -->

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% block scripts %} {% endblock %}
  </body>
</html>
